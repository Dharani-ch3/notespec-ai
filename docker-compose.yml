# Fully local stack: the engine plus Ollama running a local model (no data leaves the machine).
#   docker compose up -d
#   docker compose exec ollama ollama pull gemma3
#   docker compose exec ollama ollama pull nomic-embed-text
# Then open http://localhost:8000 and pick "ollama" as the provider.
services:
  engine:
    build: .
    ports: ["8000:8000"]
    environment:
      ENGINE_PROVIDER: ollama
      ENGINE_EMBEDDER: ollama
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma3
    volumes: ["engine-data:/data"]
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]

volumes:
  engine-data:
  ollama:
